# Заголовки безопасности. Подключаются в каждом location, где есть свои add_header,
# потому что nginx не наследует add_header из уровня server в такие location.
# frame-src: только плееры VK Видео, YouTube (без cookie) и Rutube — для роликов в «Работах» и проектах.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; frame-src https://vkvideo.ru https://www.youtube-nocookie.com https://rutube.ru; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security $hsts always;
