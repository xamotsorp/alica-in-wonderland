worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Не показываем версию nginx
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile    on;
    tcp_nopush  on;

    # Короткие таймауты — защита от «медленных» атак (slowloris)
    keepalive_timeout      15s;
    client_header_timeout  10s;
    client_body_timeout    15s;
    send_timeout           15s;
    reset_timedout_connection on;

    client_max_body_size        1m;
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Ограничение частоты запросов с одного IP
    limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m   rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=upload:10m  rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Известные сканеры уязвимостей и пустой User-Agent
    map $http_user_agent $bad_bot {
        default 0;
        ""      1;
        "~*(sqlmap|nikto|nmap|masscan|zgrab|nuclei|dirbuster|gobuster|feroxbuster|ffuf|wpscan|acunetix|netsparker|nessus|openvas|jorgee|zmeu|morfeus|python-requests|python-urllib|go-http-client|libwww-perl|httpclient|censysinspect|expanse|l9explore|l9tcpid)" 1;
    }

    # HSTS отдаём только по HTTPS
    map $scheme $hsts {
        https   "max-age=63072000; includeSubDomains";
        default "";
    }

    upstream api {
        server api:3000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
